# STM32 运行时配置
# 保存这个文件后，orun_onnx_v6.1.py 会在运行中自动重新下发配置。
# 格式是 INI，支持 # 或 ; 注释。
#
# 键名对应 STM32 串口命令：
# MT = move timeout，去目标桶超时时间，单位 ms，范围 0~120000
# PD = preopen delay，到桶后开门前等待，单位 ms，范围 0~120000
# GT = gate timeout，开门/关门动作超时，单位 ms，范围 0~120000
# DW = drop wait，开门后等待垃圾投放，单位 ms，范围 0~120000
# PC = postclose delay，关门后等待，单位 ms，范围 0~120000
# RH = return home timeout，回 home 超时时间，单位 ms，范围 0~120000
# EB = error blink，错误状态 LED 闪烁间隔，单位 ms，范围 0~120000
# SP = speed，平台移动速度，范围 0~90
# O1 = PA6 servo open angle，PA6 舵机开门角度，范围 0~180
# C1 = PA6 servo close angle，PA6 舵机关门角度，范围 0~180
# O2 = PA7 servo open angle，PA7 舵机开门角度，范围 0~180
# C2 = PA7 servo close angle，PA7 舵机关门角度，范围 0~180
#      现在默认按 SG90/MG90S 的保守位置舵机参数处理，建议先从 20/80 这种中间值试，
#      尽量别一上来就用 0/180，容易顶死后持续嗡鸣。
# OS = open settle，开门动作等待，单位 ms，范围 0~10000
# CS = close settle，关门动作等待，单位 ms，范围 0~10000

[stm32_runtime_config]
MT = 20000
PD = 1000
GT = 3000
DW = 1500
PC = 1000
RH = 20000
EB = 200
SP = 80
O1 = 20
C1 = 80
O2 = 20
C2 = 80
OS = 600
CS = 600
